name: Build with Discord RPC

# Dijalankan dengan tangan: tab Actions, "Build with Discord RPC", Run workflow.
# Patch dipasang di runner saja; kode di repo ini tidak berubah.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Pasang patch Discord RPC
        run: |
          rm -rf /tmp/discord-patch
          unzip -o discord-rpc-patch.zip -d /tmp/discord-patch
          python3 /tmp/discord-patch/apply.py

      - name: Build
        run: ./gradlew :app:assembleDev --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: square-discord-${{ github.sha }}
          path: app/build/outputs/apk/dev/*.apk
          retention-days: 14
          if-no-files-found: error
